<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Klip Açılıyor | WEİZEND</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#09090d;color:#f7f7fb;font:16px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif;padding:24px}
    main{width:min(100%,490px);text-align:center;background:#15151c;border:1px solid #37303a;border-radius:18px;padding:32px 24px;box-shadow:0 14px 44px #0007}
    h1{font-size:1.45rem;margin:0 0 12px}p{color:#c4c2ca;margin:0 0 18px}
    a{display:inline-flex;align-items:center;justify-content:center;background:#d21826;color:#fff;text-decoration:none;font-weight:800;border-radius:12px;padding:13px 22px}
    a:focus-visible{outline:3px solid #fff;outline-offset:4px}small{display:block;color:#aaa7b2;margin-top:20px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
 <main>
  <h1>🎬 Klip açılıyor…</h1>
  <p id="message">Kick klibi tarayıcıda yeni sekmede açılmaya çalışılıyor.</p>
  <a id="fallback" hidden rel="noopener noreferrer">Klibi Kick'te Aç</a>
  <small>Telefonun bağlantı ayarları Kick uygulamasını açmayı tercih edebilir. Bunu bir web sitesi kesin olarak engelleyemez.</small>
 </main>
 <script>
 (function(){
   'use strict';
   const fallback=document.getElementById('fallback');
   const message=document.getElementById('message');
   let url;
   try{
     const value=new URLSearchParams(location.search).get('clip');
     if(!value)throw new Error('missing');
     url=new URL(value);
     if(url.protocol!=='https:' || !['kick.com','www.kick.com'].includes(url.hostname.toLowerCase()) ||
        !/^\/[a-zA-Z0-9_-]+\/clips\/[a-zA-Z0-9_-]+\/?$/.test(url.pathname) || url.username || url.password)
       throw new Error('not a Kick clip');
   }catch(_){
     document.querySelector('h1').textContent='Geçersiz klip bağlantısı';
     message.textContent='Lütfen çekiliş sayfasına dönerek bağlantıyı yeniden aç.';
     return;
   }
   fallback.href=url.href;
   fallback.hidden=false;
   // Bir kullanıcı dokunuşuyla zaten yeni sekmede açıldık. Buradan yapılan
   // normal sayfa yönlendirmesi bazı mobil tarayıcılarda uygulama bağlantısı
   // yakalamasını önler; iOS/Android davranışı site tarafından garanti edilemez.
   setTimeout(function(){location.replace(url.href)},80);
 })();
 </script>
</body>
</html>
