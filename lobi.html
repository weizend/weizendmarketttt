<script>(()=>{'use strict';
const API='https://weizend-botrix.weizendtv.workers.dev';
const KEY='weizend_market_session_secure_v2';
const ID=new URL(location.href).searchParams.get('id')||'';
const $=id=>document.getElementById(id);
let lobby=null,my=null,refreshing=false,busy=false,snapshot='';
// Independent per-tab ID; survives F5 but not an unrelated new tab.
const PRESENCE_SESSION_KEY='wz31_presence_session_v3121';
let presenceSessionId='';
try{presenceSessionId=sessionStorage.getItem(PRESENCE_SESSION_KEY)||'';
 if(!/^[0-9a-f-]{36}$/.test(presenceSessionId)){presenceSessionId=crypto.randomUUID();sessionStorage.setItem(PRESENCE_SESSION_KEY,presenceSessionId)}}
catch(_){presenceSessionId=crypto.randomUUID()}
let presenceBusy=false,lastPresenceOk=0;
async function sendPresence(action='heartbeat',leaving=false){
 if(!tok()||!member()||!presenceSessionId)return;
 if(presenceBusy && !leaving)return;
 const body=JSON.stringify({id:ID,sessionId:presenceSessionId,action});
 const headers={'Content-Type':'application/json','Authorization':'Bearer '+tok()};
 if(leaving){try{fetch(API+'/player-lobbies/presence',{method:'POST',headers,body,keepalive:true,cache:'no-store'}).catch(()=>{});}catch(_){}return}
 presenceBusy=true;
 try{const r=await fetch(API+'/player-lobbies/presence',{method:'POST',headers,body,cache:'no-store'});
   if(r.ok)lastPresenceOk=Date.now();
 }catch(_){/* retry on next heartbeat */}finally{presenceBusy=false}
}

const tok=()=>{try{return localStorage.getItem(KEY)||''}catch{return ''}};
function node(parent,type,cls,txt){const x=document.createElement(type);if(cls)x.className=cls;if(txt!==undefined)x.textContent=String(txt);parent.append(x);return x}
function btn(parent,label,fn,cls='btn small'){const x=node(parent,'button',cls,label);x.type='button';x.addEventListener('click',fn);return x}
function clear(n){n.replaceChildren()}
function flash(msg,error=false){const b=$('message');b.textContent=msg;b.className='notice'+(error?' error':'')}
function hideFlash(){$('message').classList.add('hidden')}
function game(g){return ({valorant:'VALORANT',cs2:'Counter-Strike 2',pubg:'PUBG'})[g]||g}
function gameLabels(g){return ({valorant:{player:'VALORANT oyuncu adın (Riot ID)',placeholder:'Oyuncu#TR1',group:'VALORANT grup kodu'},cs2:{player:'CS2 / Steam oyuncu adın',placeholder:'Steam takma adın',group:'CS2 grup/davet kodu'},pubg:{player:'PUBG oyuncu adın',placeholder:'PUBG takma adın',group:'PUBG grup kodu'}})[g]||{player:'Oyun içi adın',placeholder:'Oyuncu adın',group:'Oyun grup kodu'}}

function showModal(title){$('dialogTitle').textContent=title;clear($('dialogContent'));$('modal').classList.remove('hidden');document.body.style.overflow='hidden'}
function hideModal(){$('modal').classList.add('hidden');document.body.style.overflow=''}
function field(form,label,type='text',placeholder='',value='',max=80){const w=node(form,'div','field');const l=node(w,'label','',label);const a=node(w,type==='select'?'select':type==='textarea'?'textarea':'input');a.id='field_'+Math.random().toString(36).slice(2);l.htmlFor=a.id;if(a.tagName==='INPUT')a.type='text';if(type!=='select'){a.placeholder=placeholder;a.value=value;a.maxLength=max}return a}
function option(input,value,text){const o=node(input,'option','',text);o.value=value}
async function api(path,body){const headers={'Accept':'application/json'};if(tok())headers.Authorization='Bearer '+tok();if(body)headers['Content-Type']='application/json';const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),14000);
try{const res=await fetch(API+path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined,signal:abort.signal,cache:'no-store'});const data=await res.json();if(!res.ok||!data.success)throw Error(data.error||'Sunucu işlemi başarısız.');return data}finally{clearTimeout(timer)}}
function member(){return my?.member?.id===ID?my.member:null}
function isOwner(){return !!(member()&&my.user&&member().owner_uid===my.user.uid)}
function pending(){return (my?.applications||[]).find(a=>a.lobby_id===ID&&a.status==='pending')}
function joinType(){return lobby?.join_mode==='direct'?'direct':'apply'}

async function copyCode(){
 const c=member()?.invite_code;if(!c)return;
 try{if(!navigator.clipboard?.writeText)throw Error('Panoya erişilemiyor');

 }catch(_){wz3136CopyLabel('⚠ Kopyalanamadı');}

option(m,'apply','Başvurulu — lider onayı gerekir');option(m,'direct','Direkt — boş koltuk varsa anında katılır');m.value=joinType();
m.parentNode.classList.add('full');node(f,'p','muted','Direkt katılımda Kick ile oturum açmış oyuncular boş koltuğa hemen yerleşir. Grup kodu yalnızca katılan üyelere gösterilir.').classList.add('full');

function profileModal(){showModal('Oyun Hesabını Düzenle');const c=$('dialogContent');node(c,'p','', 'Oyun içi adını artık WEİZEND Profil bölümünden yönetebilirsin. Kaydın lobiye katılımlarda otomatik kullanılır.');const a=node(c,'a','btn','Profilde Düzenle');a.href='index.html?wz_profile_accounts=1'}

function render(){if(!lobby)return;
$('lobbyTitle').textContent=lobby.title;$('gameName').textContent=game(lobby.game)+' · '+lobby.region;
$('capacityCount').textContent=lobby.filled+'/'+lobby.capacity+' oyuncu';
$('lobbyMeta').textContent='Lider: '+lobby.owner_name+' · '+lobby.mode;
$('lobbyNote').textContent=lobby.note||'';

}else if(member()){

 if(lobby.presence_enabled)node(j,'p','smallprint','Canlı lobi: Bu sekmeyi açık tut. Kapanınca kısa bir yeniden bağlanma süresi sonrasında üyelik sonlandırılır.');

}else if(pending()){

}else if(my?.member){node(j,'p','warn','Başka bir lobinin üyesisin. Yeni lobiye başvurmak için önce mevcut lobiden ayrılmalısın.')}
else if(lobby.filled>=lobby.capacity){node(j,'p','warn','Bu lobi dolu.')}
else {node(j,'p','muted',joinType()==='direct'?'Boş koltuk varsa lider onayı olmadan katılabilirsin.':'Başvurun lider tarafından onaylandığında grup kodunu göreceksin.');btn(j,joinType()==='direct'?'Lobiye Direkt Katıl':'Katılmak İçin Başvur',applyModal,'btn')}
if(isOwner()){
 node(o,'p','success','👑 Bu lobinin kaptanısın.');
 const controls=node(o,'div','actions');btn(controls,'Oyun Kodunu Düzenle',codeModal,'btn alt small');btn(controls,'Kapasiteyi Düzenle',capacityModal,'btn alt small');btn(controls,'Katılım Şeklini Düzenle',joinModeModal,'btn alt small');
 const members=my.members||[];for(const m of members){const line=node(o,'div','line');const info=node(line,'div');node(info,'strong','',(m.is_leader?'👑 ':'')+m.kick_name);node(info,'p','',m.game_name||'Oyun adı belirtilmedi');if(!m.is_leader){const actions=node(line,'div','lineBtns');btn(actions,'Lider Yap',()=>{if(confirm(m.kick_name+' yeni lider olsun mu?'))mutate({action:'transfer',target:m.kick_uid})},'btn alt small');btn(actions,'Çıkar',()=>{if(confirm(m.kick_name+' çıkarılsın mı?'))mutate({action:'kick',target:m.kick_uid})},'btn danger small')}}
 const bottom=node(o,'div','actions');btn(bottom,'Lobiyi Kapat',()=>{if(confirm('Lobi ve tüm başvurular kalıcı olarak silinsin mi?'))mutate({action:'close'})},'btn danger');
 const incoming=my.incoming||[];if(!incoming.length)node(a,'p','muted',joinType()==='direct'?'Direkt katılım açık; üyeler boş koltuklara kendileri katılıyor.':'Bekleyen başvuru yok.');
 for(const app of incoming){const line=node(a,'div','line');const info=node(line,'div');node(info,'strong','',app.kick_name);node(info,'p','',app.game_name+(app.note?' · '+app.note:''));const b=node(line,'div','lineBtns');btn(b,'Kabul Et',()=>mutate({action:'accept',target:app.kick_uid}),'btn small');btn(b,'Reddet',()=>mutate({action:'reject',target:app.kick_uid}),'btn alt small')}
}else{
 node(o,'p','muted','Yönetim işlemleri yalnızca lobi lideri tarafından yapılabilir.');
 node(a,'p','muted',pending()?'Başvurun henüz onaylanmadı. Kabul edilince oyun davet kodunu burada görebilirsin.':'Kaptanın bekleyen başvuruları yalnızca kendisine görünür.');
}
}
async function refresh(silent=false){if(refreshing)return null;refreshing=true;
try{
 const [detail, mine]=await Promise.all([
   api('/player-lobbies/detail?id='+encodeURIComponent(ID)),
   tok()?api('/player-lobbies/mine').catch(()=>null):Promise.resolve(null)
 ]);
 const state=JSON.stringify([detail.lobby,mine]);if(state!==snapshot){snapshot=state;lobby=detail.lobby;my=mine;if($('modal').classList.contains('hidden'))render()}
 document.body.classList.remove('wz-lobby-booting');
 if(member() && Date.now()-lastPresenceOk>20000)void sendPresence('heartbeat');
 return true;
}catch(e){if(!silent){document.body.classList.remove('wz-lobby-booting');flash('Lobi yüklenemedi: '+e.message,true)}return false}finally{refreshing=false}}
$('copyGroup').addEventListener('click',copyCode);
$('refreshBtn').addEventListener('click',async()=>{const b=$('refreshBtn');if(b.disabled)return;b.disabled=true;b.textContent='⏳ Kontrol ediliyor...';try{const ok=await refresh();b.textContent=ok?'✓ Güncel':'⚠ Hata'}finally{setTimeout(()=>{b.textContent='↻ Yenile';b.disabled=false},1100)}});
$('closeModal').addEventListener('click',hideModal);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))hideModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideModal()});
if(new URL(location.href).searchParams.get('pending')==='1'){
 // Opened synchronously by the create button: show the full themed page while
 // the real lobby id is being created. Parent tab replaces this URL on success.
 $('wz3136LoadingText').textContent='Yeni oyun lobin oluşturuluyor…';
 setTimeout(()=>{if(location.search.includes('pending=1'))$('wz3136LoadingText').textContent='Oluşturma işlemi sürüyor. İşlem uzarsa önceki sekmeye dönerek kontrol et.'},16000);
}else if(!/^[0-9a-f-]{36}$/.test(ID)){document.body.classList.remove('wz-lobby-booting');flash('Geçerli bir lobi adresi açmalısın.',true);$('lobbyTitle').textContent='Lobi bulunamadı'}
else {
 refresh();
 setInterval(()=>{if(!busy&&!document.hidden&&$('modal').classList.contains('hidden'))void refresh(true)},10000);
 // Background tabs are throttled by browsers; 25 seconds + generous 3-minute TTL.
 setInterval(()=>{if(member())void sendPresence('heartbeat')},25000);
 window.addEventListener('pagehide',()=>sendPresence('close',true));
 window.addEventListener('pageshow',()=>{if(member())void sendPresence('heartbeat')});
} 
})();</script><script id="wz82-lobby-share">(function(){'use strict';const b=document.getElementById('wz82ShareLobby');if(!b)return;b.addEventListener('click',async()=>{const id=new URL(location.href).searchParams.get('id')||'';if(!/^[0-9a-f-]{36}$/i.test(id))return;const link='https://www.weizend.com/lobi/'+encodeURIComponent(id);try{if(navigator.share){await navigator.share({title:(document.getElementById('lobbyTitle')?.textContent||'WEİZEND Oyuncu Ara'),url:link});return}}catch(e){if(e?.name==='AbortError')return}try{await navigator.clipboard.writeText(link);b.textContent='✅ Kopyalandı';setTimeout(()=>b.textContent='🔗 Lobiyi Paylaş',2200)}catch(e){prompt('Lobi bağlantısı:',link)}});})();</script><script id="wz81BlockButtons">
(function(){'use strict';
const API='https://weizend-botrix.weizendtv.workers.dev';
const KEY='weizend_market_session_secure_v2';
let blocked=false, reason='', lastToken='', old=new WeakMap();
const isAction=t=>/^(katıl|başvur|başvuru yap|oyuncu ara|takım ara|takım oluştur|takım kur|kayıt ol|kayıt yaptır|lobi kur|lobi oluştur|lobiye katıl|takıma katıl|katılımı tamamla|ücretsiz katıl|bilet kullan|bilet ekle|satın al|hemen al|maçı başlat|lobiyi aç|lobiye katıldım|hazır(?:ım)?|skor gönder|onayla)$/i.test(t.trim().replace(/\s+/g,' ')) || /^(katıl|başvur|lobi kur|lobi oluştur|satın al|kayıt ol|turnuvaya katıl)\b/i.test(t.trim());
function paint(){
 const noticeId='wz81BlockNotice'; let notice=document.getElementById(noticeId);
 if(blocked){if(!notice){notice=document.createElement('div');notice.id=noticeId;notice.setAttribute('role','status');notice.style.cssText='position:fixed;bottom:15px;left:15px;right:15px;max-width:440px;z-index:2147483000;border:1px solid #dd4e5b;border-radius:12px;padding:12px;background:#270e15;color:#fff;box-shadow:0 0 20px #9b122655;font:600 13px system-ui';document.body.appendChild(notice);}notice.textContent='🔒 CEZALISIN — '+(reason||'Yeni işlemlere katılamazsın.');}
 else if(notice)notice.remove();
 for(const b of document.querySelectorAll('button')){
  if(blocked){if(!old.has(b) && !b.disabled && isAction(b.textContent||'')){
    old.set(b,{html:b.innerHTML});b.textContent='🔒 CEZALISIN';b.disabled=true;b.setAttribute('aria-disabled','true');
  }}else if(old.has(b)){const x=old.get(b);b.innerHTML=x.html;b.disabled=false;b.removeAttribute('aria-disabled');old.delete(b);}
 }
}
async function readStatus(){
 let token='';try{token=localStorage.getItem(KEY)||'';}catch(_){}
 if(!token){blocked=false;lastToken='';paint();return;}
 try{const r=await fetch(API+'/profile',{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store'});
 if(!r.ok)return;const d=await r.json();if((localStorage.getItem(KEY)||'')!==token)return;
 blocked=String(d.accountStatus||'').toLowerCase()==='blocked';reason=String(d.blockedReason||'').slice(0,160);lastToken=token;paint();
 }catch(_){} // Worker authorization remains authoritative if network fails
}
function start(){readStatus();setInterval(readStatus,30000);setInterval(()=>{if(blocked)paint()},5000);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
