<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEİZEND | Günlük Ödül</title><link rel="icon" href="favicon.ico"><style>
:root{color-scheme:dark;--red:#e82c3c;--muted:#a5a5b2;--line:#303039}*{box-sizing:border-box}body{margin:0;background:#0e0e12;color:#f5f5f7;font:15px system-ui,sans-serif}main{max-width:980px;margin:auto;padding:20px 14px 50px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}a{color:#fff}h1{font-size:clamp(24px,5vw,38px);margin:18px 0 6px}h2{font-size:18px;margin:0 0 12px}p{line-height:1.55}.brand{font-weight:900;letter-spacing:2px;color:#ff4d5c}.muted{color:var(--muted)}.card{background:#18181e;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.hero{background:linear-gradient(120deg,#34171c,#18181e 70%);border-color:#72313a}.prize{font-size:clamp(22px,5vw,34px);font-weight:900;color:#ffd17b;margin:8px 0}.tag{display:inline-block;border:1px solid #70313a;color:#ff9aa2;padding:5px 10px;border-radius:99px;font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{background:#23232a;padding:12px 7px;border-radius:12px;text-align:center}.stat b{display:block;font-size:23px}.stat small{color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.tile{position:relative;border:1px solid #42424a;background:linear-gradient(140deg,#373740,#222229);border-radius:10px;color:#fff;min-height:76px;aspect-ratio:.9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:3px;font-weight:800;cursor:pointer}.tile.red{background:linear-gradient(130deg,#b62737,#64131c);border-color:#ef5261}.tile.open{background:#16372b;border-color:#368a60;color:#91f3b9}.tile:disabled{cursor:default;opacity:.73}.tile.open:disabled{opacity:1}.tile .symbol{font-size:19px}.tile small{font-size:10px;max-width:100%;overflow-wrap:anywhere}.progress{height:8px;background:#32323a;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;background:var(--red);height:100%}.btn,button:not(.tile){background:#d62435;color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:750;cursor:pointer}.secondary{background:#303039!important}.btn:disabled,button:disabled:not(.tile){opacity:.45;cursor:default}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}input,textarea,select{color:#fff;background:#222229;border:1px solid #45454f;border-radius:8px;padding:10px;font:inherit;width:100%}input[type=month]{width:auto}input[type=checkbox]{width:auto}label{display:block;margin:12px 0 6px}.list{display:grid;gap:7px}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.line:last-child{border-bottom:0}.points{font-weight:800;color:#ffcd75}.message{min-height:24px;color:#ffc4c4;white-space:pre-wrap}.rewardgrid{display:flex;flex-wrap:wrap;gap:7px}.reward{background:#25252c;border-radius:8px;padding:8px 11px}.reward.red{background:#57212a}.scratched{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.8);opacity:.4}100%{transform:scale(1);opacity:1}}@media(max-width:440px){main{padding:12px 9px 35px}.card{padding:12px}.tiles{gap:4px}.tile{min-height:57px;border-radius:7px}.tile .symbol{font-size:15px}.tile small{font-size:9px}.stat b{font-size:18px}}
.tilewrap{min-width:0;display:flex;flex-direction:column;gap:3px}.tilewrap .tile{width:100%}.deliverylabel{font-size:10px;text-align:center;font-weight:750;line-height:1.25;overflow-wrap:anywhere}.deliverylabel.ok{color:#6fe59a}.deliverylabel.bad{color:#ff717b}.deliverylabel.wait{color:#ffc978}.tilewrap button.retry{padding:6px 2px;font-size:10px;line-height:1.2;width:100%;border-radius:6px}.adminactions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}@media(max-width:440px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}.tilewrap .tile{min-height:55px}.deliverylabel{font-size:9px}}
</style></head><body><main><header><span class="brand">WEİZEND</span><a id="back" href="index.html?wz_view=profile">← Profil</a></header><h1 id="title">Günlük Ödül</h1><p class="muted" id="subtitle">Her gün bir ücretsiz kutu. Ödülleri keşfet, aylık yarışta zirveye çık.</p><div class="controls"><input id="month" type="month" aria-label="Takvim ayı"><button id="load" class="secondary">Yükle</button></div><p class="message" id="message" role="status" aria-live="polite"></p><div id="app"></div></main><script>
(()=>{'use strict';const admin=new URLSearchParams(location.search).get('admin')==='1',app=document.getElementById('app'),msg=document.getElementById('message'),month=document.getElementById('month');const key=admin?'weizend_market_admin_token_v3':'weizend_market_session_secure_v2',store=admin?sessionStorage:localStorage,api=/^(www\.)?weizend\.com$/i.test(location.hostname)?location.origin+'/api':'https://weizend-botrix.weizendtv.workers.dev';const prefix=admin?'/admin/scratch/':'/scratch/';let state=null,busy=false,clockTimer=null,deliveryTimer=null,loadSeq=0,lastAutoDay=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>Number(x||0).toLocaleString('tr-TR');const day=()=>new Date(Date.now()+10800000).toISOString().slice(0,10);month.value=day().slice(0,7);month.max=month.value;if(admin){document.getElementById('title').textContent='Günlük Ödül Yönetimi';document.getElementById('subtitle').textContent='Mevcut ayı görüntüle, sonraki ayın ödüllerini hazırla ve teslimatları yönet.';document.getElementById('back').href='admin.html';document.getElementById('back').textContent='← Yönetim paneli';}function say(s){msg.textContent=s||''}async function req(path,body){const token=store.getItem(key);if(!token)throw Error(admin?'Önce yönetim panelinde oturum aç.':'Önce WEİZEND ana sayfasından Kick hesabını doğrula.');const r=await fetch(api+prefix+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store'});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'İşlem başarısız.');return d;}
function rewards(a,red=false){const counts={};for(const p of a||[])counts[p]=(counts[p]||0)+1;return Object.entries(counts).map(([p,n])=>`<span class="reward ${red?'red':''}">${fmt(p)} puan × ${n}</span>`).join('')||'<span class="muted">Henüz belirlenmedi</span>'}function leaderboard(s){return `<section class="card"><h2>🏆 Aylık liderlik · İlk 10</h2>${(s.rank||[]).map((r,i)=>`<div class="line"><span>${i+1}. <b>${esc(r.username)}</b></span><span>${r.total}/${s.days}</span></div>`).join('')||'<p class="muted">Henüz açılan kutu yok.</p>'}<p class="muted">En çok kutu açan önde; eşitlikte bu sayıya ilk ulaşan kazanır.</p></section>`}function grand(s){return `<section class="card hero"><span class="tag">AYIN BÜYÜK ÖDÜLÜ</span><div class="prize">${esc(s.prize||'Henüz belirlenmedi')}</div>${s.winner?`<p>🏆 Kazanan: <b>${esc(s.winner.username)}</b> · ${s.winner.total}/${s.days}</p><p>${s.grand?.delivered?'Teslim edildi':s.grand?.claimed?'Teslimat bekliyor':'Henüz talep edilmedi'}</p>${s.winner.isMe&&!s.grand?'<button id="grandClaim">Ödülü talep et</button>':''}`:'<p>Ayın tüm kutularını ilk tamamlayan kazanır. Tamamlayan olmazsa ay sonunda lider kazanır.</p>'}</section>`}function previousChampion(s){const w=s.previousChampion;if(!w)return '';return `<section class="card hero"><span class="tag">GEÇEN AYIN KAZANANI · ${esc(w.month)}</span><div class="prize">🏆 ${esc(w.username)}</div><p>Kazandığı ödül: <b class="points">${esc(w.prize)}</b> · ${w.total}/${w.days} kutu</p><p class="muted">${w.delivered?'Teslim edildi':w.claimed?'Teslimat bekliyor':'Henüz talep edilmedi'}</p>${w.isMe&&!w.claimed&&!admin?`<button data-prev-claim="${esc(w.month)}">Ödülü talep et</button>`:''}</section>`;}function userGrand(s){if(s.month===s.day.slice(0,7))return grand(s);const p=s.ownPastPrize;if(!p||s.previousChampion?.month===s.month)return '';return `<section class="card"><h2>Kişisel ödül teslimatın</h2><p>${esc(p.prize)} · ${p.delivered?'Teslim edildi':p.claimed?'Teslimat bekliyor':'Henüz talep edilmedi'}</p>${!p.claimed?'<button id="grandClaim">Ödülü talep et</button>':''}</section>`;}function bindPrevious(){app.querySelectorAll('[data-prev-claim]').forEach(e=>e.onclick=()=>act('grand-claim',{month:e.dataset.prevClaim},'Talebin kaydedildi.'));}function tick(){clearTimeout(clockTimer);if(admin||!state||state.month!==state.day.slice(0,7))return;const e=document.getElementById('countdown');if(!e)return;const left=Math.max(0,Number(state.next)-Date.now());const sec=Math.ceil(left/1000);e.textContent=left?'Yeni hak: '+[Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60].map(x=>String(x).padStart(2,'0')).join(':'):'Yeni gün başladı · Takvimi yenile';if(left)clockTimer=setTimeout(tick,1000);else {document.querySelectorAll('.tile').forEach(x=>x.disabled=true);if(!busy&&day()>state.day&&lastAutoDay!==state.day){lastAutoDay=state.day;const current=day().slice(0,7);month.max=current;if(month.value===state.month)month.value=current;load();}}}
function deliveryLabel(r){if(r.delivery==='delivered')return '<div class="deliverylabel ok">Teslim edildi</div>';const wait=Math.max(0,Math.ceil((Number(r.retry_after)-Date.now())/1000));if(wait)return `<div class="deliverylabel wait" data-wait="${Number(r.retry_after)}">Bekleniyor · ${wait} sn</div>`;if(r.attempt_state==='retry_allowed')return `<div class="deliverylabel bad">Teslim edilmedi</div><button class="retry" data-retry="${r.box}" type="button">Tekrar dene</button>`;return '<div class="deliverylabel bad">Teslimat doğrulanmadı</div><button class="retry secondary" data-check="1" type="button">Kontrol et</button>'}
function deliveryClock(){clearTimeout(deliveryTimer);if(admin||!state)return;const nodes=[...app.querySelectorAll('[data-wait]')];if(!nodes.length)return;let expired=false;for(const el of nodes){const left=Math.max(0,Math.ceil((Number(el.dataset.wait)-Date.now())/1000));el.textContent='Bekleniyor · '+left+' sn';if(!left)expired=true;}if(expired&&!busy){load();return;}deliveryTimer=setTimeout(deliveryClock,1000);}
function render(s){clearTimeout(deliveryTimer);state=s;if(admin){renderAdmin(s);return}if(!s.prize){app.innerHTML=previousChampion(s)+'<section class="card"><h2>Bu ayın takvimi henüz hazır değil.</h2><p class="muted">Yönetici takvimi açtığında katılabilirsin.</p></section>';bindPrevious();return;}const opened=new Map((s.rows||[]).map(r=>[r.box,r])),red=[7,14,21,s.days],miss=Math.max(0,(s.month===s.day.slice(0,7)?Number(s.day.slice(-2))-1:s.days)-(s.rows||[]).filter(r=>r.day!==s.day).length),unlocked=s.total>=s.threshold&&s.reds<4;app.innerHTML=userGrand(s)+previousChampion(s)+`<section class="card"><h2>Bu ayın kutu ödülleri</h2><p class="muted">Normal kutular</p><div class="rewardgrid">${rewards(s.normal)}</div><p class="muted">Kırmızı kutular</p><div class="rewardgrid">${rewards(s.special,true)}</div><p class="muted">${s.subscriberMultiplier>1?`<strong style="color:#76e7a0">★ Aktif abonelere x${s.subscriberMultiplier} puan!</strong> <br>Abonelik kutu açılırken doğrulanır. `:''}Ödüller her kullanıcıya özeldir; hangi kutudan hangi ödül çıkacağı gizlidir.</p></section><section class="card"><div class="stats"><div class="stat"><b>${s.total}/${s.days}</b><small>Açılan kutu</small></div><div class="stat"><b>${s.available?1:0}</b><small>Bugünkü hak</small></div><div class="stat"><b>${miss}</b><small>Kaçırılan gün</small></div></div><p id="countdown" class="muted"></p><div class="tiles">${Array.from({length:s.days},(_,i)=>{const n=i+1,r=opened.get(n),special=red.includes(n),locked=special&&!unlocked;return `<div class="tilewrap"><button type="button" class="tile ${special?'red':''} ${r?'open':''}" data-box="${n}" ${r||!s.available||locked?'disabled':''} aria-label="${n} numaralı kutu${locked?', kilitli':''}"><span>${n}</span><span class="symbol">${r?'✓':locked?'🔒':special?'🎁':'✦'}</span>${r?`<small>${fmt(r.points)} P${r.multiplier>1?` · x${r.multiplier}`:''}</small>`:''}</button>${r?deliveryLabel(r):''}</div>`}).join('')}</div><p>${s.reds===4?'Tüm kırmızı kutular açıldı.':unlocked?'🔓 Bir kırmızı kutu seçebilirsin.':'🔴 Sıradaki kırmızı kutu için '+Math.max(0,s.threshold-s.total)+' kutu kaldı.'}</p><div class="progress"><i style="width:${Math.min(100,s.total/Math.max(1,s.threshold)*100)}%"></i></div><p class="muted">Bir gün kullanılmayan hak birikmez. Her gün Türkiye saatiyle 00.00’da yenilenir.</p></section>`+(s.month===s.day.slice(0,7)?leaderboard(s):'')+`<section class="card"><h2>Ödül geçmişin</h2>${(s.rows||[]).slice().reverse().map(r=>`<div class="line"><span>${esc(r.day)} · Kutu ${r.box}<br><small class="muted">${r.delivery==='delivered'?'Teslim edildi':r.attempt_state==='retry_allowed'&&Date.now()>=Number(r.retry_after)?'Teslim edilmedi · Tekrar dene':'Teslimat onayı bekleniyor'}</small></span><span class="points">${r.multiplier>1?`<small class="muted">${fmt(r.base_points)} × ${r.multiplier}</small><br>`:''}${fmt(r.points)} P</span></div>`).join('')||'<p class="muted">Henüz ödülün yok.</p>'}</section>`;bindPrevious();tick();deliveryClock();app.querySelectorAll('[data-retry]').forEach(el=>el.onclick=()=>retry(Number(el.dataset.retry)));app.querySelectorAll('[data-check]').forEach(el=>el.onclick=()=>{if(!busy){el.disabled=true;load();}});app.querySelectorAll('[data-box]').forEach(el=>el.onclick=()=>claim(Number(el.dataset.box)));document.getElementById('grandClaim')?.addEventListener('click',()=>act('grand-claim',{month:s.month},'Talebin kaydedildi.'));}
async function load(){month.max=day().slice(0,7);const seq=++loadSeq;try{const s=await req('state?month='+encodeURIComponent(month.value));if(seq!==loadSeq)return;render(s);}catch(e){if(seq===loadSeq){say(e.message);app.innerHTML='';}}}async function claim(box){if(busy||!state?.available)return;busy=true;app.querySelectorAll('.tile').forEach(x=>x.disabled=true);say('Ödül açılıyor…');try{const s=await req('claim',{month:state.month,box});try{localStorage.setItem('wz_daily_reward_changed_v7',String(Date.now()));}catch(_){}render(s);const tile=app.querySelector(`[data-box="${box}"]`);tile?.classList.add('scratched');say('🎉 '+box+' numaralı kutudan '+fmt(s.points)+' puan kazandın!'+(s.multiplier>1?' (Abone bonusu x'+s.multiplier+')':'')+' Bot onayı ödül geçmişinde görünür.');}catch(e){say(e.message+' · Takvim yenileniyor.');await load();}finally{busy=false;}}async function retry(box){if(busy)return;busy=true;app.querySelectorAll('[data-retry],[data-check],.tile').forEach(x=>x.disabled=true);say('Puan teslimatı tekrar başlatılıyor…');try{const s=await req('retry',{month:state.month,box});render(s);say('Teslimat durumu kontrol ediliyor.');}catch(e){say(e.message);await load();}finally{busy=false;}}
async function act(path,body,notice){if(busy)return;busy=true;say('İşleniyor…');try{await req(path,body);say(notice||'Kaydedildi.');await load();}catch(e){say(e.message);}finally{busy=false;}}
function parse(s){return String(s).trim().split(/[\s,;]+/).filter(Boolean).map(Number)}function rewardEditor(m,days,c,initial=false){const id=initial?'initial':'next',normal=c?.normal||Array(days-4).fill(100),red=c?.red||[500,1000,2000,3000],mult=c?.subscriberMultiplier||2;return `<section class="card hero"><span class="tag">${initial?'TEK SEFERLİK İLK KURULUM':'SONRAKİ AY ÖDÜLLERİ'}</span><h2 style="margin-top:12px">${esc(m)} · ${days} kutu</h2><p class="muted">${initial?'Henüz hiçbir aktif/geçmiş takvim yok. Bir kez kaydedildiğinde bu ayın ödülleri kilitlenir.':'Bu ayın açılan kutularını ve ödüllerini etkilemez. Yeni ay başladığında bu ayarlar otomatik kullanılır.'}</p><label>Normal ödüller (${days-4} adet, virgülle ayrılmış)</label><textarea id="${id}-normal" rows="4">${normal.join(', ')}</textarea><label>Kırmızı ödüller (4 adet)</label><input id="${id}-red" value="${red.join(', ')}"><label>Büyük ödül</label><input id="${id}-prize" maxlength="160" value="${esc(c?.prize||'')}"><label>Abone ödül çarpanı</label><select id="${id}-mult">${[1,2,3].map(x=>`<option value="${x}" ${x===mult?'selected':''}>x${x}</option>`).join('')}</select><label><input type="checkbox" id="${id}-active" ${c?.active===false?'':'checked'}> Takvim aktif başlasın</label><button id="${id}-save">${initial?'İlk takvimi oluştur ve kilitle':'Sonraki ay ödüllerini kaydet'}</button></section>`;}
function bindEditor(m,days,initial=false){const id=initial?'initial':'next',get=k=>document.getElementById(id+'-'+k);get('save')?.addEventListener('click',()=>{const normal=parse(get('normal').value),red=parse(get('red').value),prize=get('prize').value.trim();if(normal.length!==days-4||red.length!==4||[...normal,...red].some(x=>!Number.isSafeInteger(x)||x<=0||x>1000000)||!prize){say('Kutu sayısını, puanları ve büyük ödülü kontrol et.');return;}if(initial&&!confirm('İlk ayın ödülleri kaydedildikten sonra değiştirilemeyecek. Onaylıyor musun?'))return;act('save',{month:m,normal,red,prize,active:get('active').checked,multiplier:Number(get('mult').value),bootstrap:initial},initial?'İlk takvim oluşturuldu.':'Sonraki ayın ödülleri kaydedildi.');});}
function renderAdmin(s){const c=s.config,isCurrent=s.month===s.currentMonth,next=s.nextConfig;app.innerHTML=`<section class="card"><span class="tag">${isCurrent?'MEVCUT AY · ÖDÜLLER KİLİTLİ':'GEÇMİŞ AY · SALT OKUNUR'}</span><h2 style="margin-top:12px">${esc(s.month)} · ${s.days} kutu</h2>${c?`<p class="muted">Normal ödüller</p><div class="rewardgrid">${rewards(c.normal)}</div><p class="muted">Kırmızı ödüller</p><div class="rewardgrid">${rewards(c.red,true)}</div><p>Büyük ödül: <b>${esc(c.prize)}</b> · Abone çarpanı: x${c.subscriberMultiplier}</p><p>Takvim: ${c.active?'Aktif':'Pasif'}</p>${isCurrent?`<button id="toggle" class="secondary">${c.active?'Takvimi duraklat':'Takvimi yeniden aç'}</button>`:''}`:'<p class="muted">Takvim henüz oluşturulmadı.</p>'}<p class="muted">Ödül listesi, büyük ödül ve çarpan bu ay değiştirilemez.</p></section>`+(isCurrent&&s.bootstrap?rewardEditor(s.month,s.days,null,true):'')+(next?rewardEditor(next.month,next.days,next.config)+`<p class="muted">${next.saved?'✓ Sonraki ayın özel ayarları kaydedilmiş.':'Henüz ayrı ayar yok; mevcut ödüller otomatik devreder.'}</p>`:'')+grand(s)+previousChampion(s)+leaderboard(s)+`<section class="card"><h2>Bot onayı bekleyen işlemler (en fazla 100)</h2>${(s.pending||[]).map(p=>`<div class="line"><span>${esc(p.username)} · ${esc(p.day)} · Kutu ${p.box}<br><small class="muted">${fmt(p.points)} puan · ${esc(p.failure_reason||'Bot onayı bekleniyor')}</small></span><div class="adminactions"><button class="secondary" data-id="${esc(p.id)}">Teslimatı doğrula</button><button class="secondary" data-allow="${esc(p.id)}" ${Date.now()<Number(p.retry_after)?'disabled':''}>Tekrar denemeye izin ver</button></div></div>`).join('')||'<p class="muted">Bekleyen işlem yok.</p>'}</section>${s.grand?.claimed&&!s.grand?.delivered?'<button id="delivered">Büyük ödülü teslim edildi işaretle</button>':''}`;if(next)bindEditor(next.month,next.days);if(isCurrent&&s.bootstrap)bindEditor(s.month,s.days,true);document.getElementById('toggle')?.addEventListener('click',()=>{if(confirm(c.active?'Takvimi duraklatmak istediğine emin misin?':'Takvimi yeniden açmak istediğine emin misin?'))act('toggle',{month:s.month,active:!c.active});});app.querySelectorAll('[data-allow]').forEach(e=>e.onclick=()=>{if(confirm('BotRix geçmişinden puanın VERİLMEDİĞİNİ ve eski komutun artık sırada olmadığını kesin olarak kontrol ettin mi? Yanlış onay çift puan riski oluşturur.'))act('allow-retry',{month:s.month,id:e.dataset.allow,confirmed:true},'Kullanıcı tekrar deneyebilir.');});app.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>{if(confirm('Bot geçmişinde puanın gerçekten verildiğini kontrol ettin mi? Bu işlem puan göndermez.'))act('confirm-points',{month:s.month,id:e.dataset.id,confirmed:true});});document.getElementById('delivered')?.addEventListener('click',()=>{if(confirm('Büyük ödül gerçekten teslim edildi mi?'))act('delivered',{month:s.month});});}
document.getElementById('load').onclick=()=>{if(!busy){say('');load();}};month.onchange=()=>{if(!busy){say('');load();}};document.addEventListener('visibilitychange',()=>{if(!admin&&!document.hidden&&!busy&&state&&state.month===state.day.slice(0,7)&&day()>state.day&&lastAutoDay!==state.day){lastAutoDay=state.day;month.max=day().slice(0,7);month.value=month.max;load();}});load();})();</script></body></html>
